name: Temporary OEWS 2002-2018 downloader

on:
  push:
    paths:
      - ".github/workflows/oews-temp.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download preserved OEWS raw folder from openICPSR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base='https://www.openicpsr.org/openicpsr'
          dir='/openicpsr/198751/fcr:versions/V1/04_OEWS/data/inputs/raw'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          curl -L --fail --show-error -A "$ua" -c cookies.txt "$base/" -o /dev/null
          curl -L --fail --show-error -A "$ua" -b cookies.txt -c cookies.txt             "$base/project/198751/version/V1/download/project?dirPath=$(python3 - <<'PY'
import urllib.parse
print(urllib.parse.quote('/openicpsr/198751/fcr:versions/V1/04_OEWS/data/inputs/raw', safe=''))
PY
)" -o out/openICPSR_198751_OEWS_raw.zip
          test -s out/openICPSR_198751_OEWS_raw.zip
          unzip -tq out/openICPSR_198751_OEWS_raw.zip
          unzip -l out/openICPSR_198751_OEWS_raw.zip | tee out/CONTENTS.txt
          count=$(unzip -Z1 out/openICPSR_198751_OEWS_raw.zip | grep -E 'nat4d_.*\.(xls|xlsx)$' | wc -l)
          echo "nat4d_workbook_count=$count" | tee out/VALIDATION.txt
          test "$count" -eq 19
          sha256sum out/openICPSR_198751_OEWS_raw.zip > out/SHA256SUMS.txt
      - name: Upload OEWS preserved bundle
        uses: actions/upload-artifact@v4
        with:
          name: OEWS_2002_2018_openICPSR_preserved
          path: out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
