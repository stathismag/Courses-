name: Temporary OEWS 2002-2018 resolver

on:
  push:
    paths:
      - ".github/workflows/oews-temp.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect openICPSR preserved OEWS archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.openicpsr.org/openicpsr/project/198751/version/V1/view?path=%2Fopenicpsr%2F198751%2Ffcr%3Aversions%2FV1%2F04_OEWS%2Fdata%2Finputs%2Fraw&type=folder'
          curl -L --fail --show-error -A 'Mozilla/5.0' "$url" -o page.html
          echo '--- candidate download/file links ---'
          grep -Eo 'href="[^"]+"' page.html | sed 's/^href="//;s/"$//' | grep -Ei 'download|nat4d|198751|file' | head -200 || true
          echo '--- filename context ---'
          grep -n -E 'nat4d_2002_dl|nat4d_may2003|nat4d_M2018' page.html | head -50 || true
      - name: Upload resolver page
        uses: actions/upload-artifact@v4
        with:
          name: openICPSR_resolver_page
          path: page.html
          if-no-files-found: error
          retention-days: 1
