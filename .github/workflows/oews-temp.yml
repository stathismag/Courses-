name: Temporary OEWS downloader
on:
  push:
    paths:
      - ".github/workflows/oews-temp.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch preserved OEWS folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          BASE='https://www.openicpsr.org/openicpsr'
          URL='https://www.openicpsr.org/openicpsr/project/198751/version/V1/download/project?dirPath=%2Fopenicpsr%2F198751%2Ffcr%3Aversions%2FV1%2F04_OEWS%2Fdata%2Finputs%2Fraw'
          curl -L -A "$UA" -c cookies.txt "$BASE/" -o /dev/null
          curl -L --fail --show-error -A "$UA" -b cookies.txt "$URL" -o out/openICPSR_198751_OEWS_raw.zip
          test -s out/openICPSR_198751_OEWS_raw.zip
          unzip -tq out/openICPSR_198751_OEWS_raw.zip
          unzip -l out/openICPSR_198751_OEWS_raw.zip > out/CONTENTS.txt
          count=$(unzip -Z1 out/openICPSR_198751_OEWS_raw.zip | grep -E 'nat4d_.*\.(xls|xlsx)$' | wc -l)
          echo "nat4d_workbook_count=$count" > out/VALIDATION.txt
          test "$count" -eq 19
          sha256sum out/openICPSR_198751_OEWS_raw.zip > out/SHA256SUMS.txt
      - name: Upload preserved bundle
        uses: actions/upload-artifact@v4
        with:
          name: OEWS_2002_2018_openICPSR_preserved
          path: out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
