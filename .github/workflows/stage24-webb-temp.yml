name: Temporary Stage24 Webb vendor
on:
  push:
    paths:
      - ".github/workflows/stage24-webb-temp.yml"
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Webb comparison files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -L --fail --show-error --retry 5             https://raw.githubusercontent.com/rmmomin/jobs-ai-exposure/master/data/source/comparison/webb_exposure_by_soc4.xlsx             -o vendor/webb_exposure_by_soc4.xlsx
          curl -L --fail --show-error --retry 5             https://raw.githubusercontent.com/rmmomin/jobs-ai-exposure/master/data/exports/comparisons/cleaned/occupation_metric_webb_soc4_ai_score.csv             -o vendor/occupation_metric_webb_soc4_ai_score.csv
          sha256sum vendor/* > vendor/SHA256SUMS.txt
          printf "mirror_repo=https://github.com/rmmomin/jobs-ai-exposure\n" > vendor/PROVENANCE.txt
          printf "underlying_measure=Michael Webb (2020) patent-task AI exposure\n" >> vendor/PROVENANCE.txt
      - name: Upload Webb files
        uses: actions/upload-artifact@v4
        with:
          name: stage24-webb-public-data
          path: vendor/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
