name: Temporary Stage25 ONET vendor
on:
  push:
    paths:
      - ".github/workflows/stage25-onet-temp.yml"
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch historical O*NET 5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -L --fail --show-error --retry 5             https://www.onetcenter.org/dl_files/db_51.zip             -o vendor/db_51.zip
          test -s vendor/db_51.zip
          unzip -tq vendor/db_51.zip
          sha256sum vendor/db_51.zip > vendor/SHA256SUMS.txt
          printf "source=https://www.onetcenter.org/db_releases.html\n" > vendor/PROVENANCE.txt
          printf "release=O*NET 5.1 November 2003\n" >> vendor/PROVENANCE.txt
          printf "archive=https://www.onetcenter.org/dl_files/db_51.zip\n" >> vendor/PROVENANCE.txt
      - name: Upload O*NET archive
        uses: actions/upload-artifact@v4
        with:
          name: stage25-onet-5.1-public-data
          path: vendor/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
