name: Temporary Stage25 ONET4 vendor
on:
  push:
    paths:
      - ".github/workflows/stage25-onet4-temp.yml"
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch historical O*NET 4.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -L --fail --show-error --retry 5             https://www.onetcenter.org/dl_files/db_40.zip             -o vendor/db_40.zip
          test -s vendor/db_40.zip
          unzip -tq vendor/db_40.zip
          sha256sum vendor/db_40.zip > vendor/SHA256SUMS.txt
          printf "source=https://www.onetcenter.org/db_transitional.html\n" > vendor/PROVENANCE.txt
          printf "release=O*NET 4.0 June 2002 final Analyst Database\n" >> vendor/PROVENANCE.txt
          printf "archive=https://www.onetcenter.org/dl_files/db_40.zip\n" >> vendor/PROVENANCE.txt
      - name: Upload O*NET 4 archive
        uses: actions/upload-artifact@v4
        with:
          name: stage25-onet-4.0-public-data
          path: vendor/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
