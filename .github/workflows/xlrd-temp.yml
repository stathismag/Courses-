name: Temporary xlrd vendor
on:
  push:
    paths:
      - ".github/workflows/xlrd-temp.yml"
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch xlrd 2.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.0.1 https://github.com/python-excel/xlrd.git src
          mkdir -p vendor
          cp -a src/xlrd vendor/xlrd
          printf "xlrd_source_tag=2.0.1\n" > vendor/PROVENANCE.txt
          printf "source=https://github.com/python-excel/xlrd\n" >> vendor/PROVENANCE.txt
          python -m compileall -q vendor/xlrd
      - name: Upload vendor package
        uses: actions/upload-artifact@v4
        with:
          name: xlrd-2.0.1-vendor
          path: vendor/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
